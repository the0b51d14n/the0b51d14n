name: Activité du profil

on:
  schedule:
    - cron: "17 4 * * *" # tous les jours vers 6 h (Paris)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-activity.mjs
      - .github/workflows/activity.yml

permissions: {}

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # publication sur la branche « output » uniquement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Générer le SVG d'activité
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-activity.mjs "${{ github.repository_owner }}" dist/activity.svg

      # Seul le SVG est publié, sur une branche orpheline : la branche principale reste propre.
      - name: Publier sur la branche output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.svg
          git commit -q -m "Mise à jour de l'activité"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" output
