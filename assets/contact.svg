<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-labelledby="t">
  <title id="t">Travaillons ensemble — un projet, une question sur mon parcours ? Ma boîte mail est ouverte.</title>
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset=".45" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity=".012"/>
    </linearGradient>
    <radialGradient id="spot" cx=".82" cy="0" r=".6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".13"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gridFade" cx=".8" cy=".5" r=".45">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".1"/></pattern>
    <radialGradient id="halo"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  
  <clipPath id="clip-c"><rect width="1000" height="200" rx="18"/></clipPath>
  <mask id="mask-c"><rect width="1000" height="200" fill="url(#gridFade)"/></mask>
  <g clip-path="url(#clip-c)">
    <rect width="1000" height="200" fill="#0a0c14"/>
    <rect width="1000" height="200" fill="url(#surface)"/>
    <rect width="1000" height="200" fill="url(#grid)" mask="url(#mask-c)"/>
    <rect width="1000" height="200" fill="url(#spot)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="199" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <ellipse cx="500" cy="100" rx="330" ry="110" fill="url(#halo)"/>
  <path id="orbit" d="M140 100 A360 80 0 1 0 860 100 A360 80 0 1 0 140 100" fill="none" stroke="url(#iris)" stroke-opacity=".3" stroke-width="1.5"/>
  <g>
    <circle r="16" fill="#22d3ee" fill-opacity=".18"/><circle r="5" fill="#22d3ee"/>
    <animateMotion dur="14s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
  </g>
  <text x="500" y="70" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8a92aa" letter-spacing="3.2">CONTACT</text>
  <text x="500" y="116" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="url(#iris)" letter-spacing="-1">Travaillons ensemble</text>
  <text x="500" y="150" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#c3c9da">Un projet, une question sur mon parcours ? Ma boîte mail est ouverte.</text>
</svg>
